name: Game CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: game

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npx firebase emulators:exec --only auth,firestore --project demo-3eal-rules "npm test"
      - run: npm run lint
      - run: npm run build
